name: Deploy to Website SolidStart ver.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-flugel-solidstart
  cancel-in-progress: true

jobs:
  test:
    name: Vitest Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

  deploy:
    name: Deploy
    needs: test  # test Jobが成功しないと実行されない
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26' # プロジェクトに合わせて変更可
          cache: 'npm'

      # 2. パッケージのインストール・ビルド実行
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 3. SSH鍵の準備
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/sakura_deploy_key
          chmod 600 ~/.ssh/sakura_deploy_key

      # 4. 転送
      - name: Sync files
        run: |
          rsync -avz --delete \
          -e "ssh -i ~/.ssh/sakura_deploy_key -o StrictHostKeyChecking=no" \
          ./.output/public/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USERNAME }}/www/pre-flight/
